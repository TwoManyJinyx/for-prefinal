<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <nav class="navbar navbar-light mb-4 rounded">
            <div class="container-fluid">
                <form class="d-flex w-100 gap-2" role="search" action="/search_student" method="get">
                    <input class="form-control" type="search" name="username" placeholder="Search student by username" aria-label="Search" />
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </nav>

        <div class="border rounded p-4 mb-4">
            <h1 class="h3 mb-3">Student Registration Form</h1>
            <form action="{{ url_for('process_registration') }}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label for="username" class="form-label">Username:</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="col-md-4">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-4">
                    <label for="course" class="form-label">Course:</label>
                    <input type="text" class="form-control" id="course" name="course" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
            {% if error %}
            <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
            {% endif %}
        </div>

        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>EMAIL</th>
                    <th>COURSE</th>
                    <th>MODIFY</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                    <td>{{ student[3] }}</td>
                    <td>
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('update_student', username=student[1]) }}" class="btn btn-sm btn-warning">Change</a>
                            <a href="{{ url_for('delete_student', username=student[1]) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this student?');">Delete</a>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No students registered yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
